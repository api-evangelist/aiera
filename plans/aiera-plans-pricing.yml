note: >-
  Aiera publishes no plans, tiers, list prices, quotas or overage rates. https://aiera.com/pricing
  returns HTTP 200 but serves the site homepage rather than a pricing page — a soft 404, not a pricing
  surface. The site's only commercial call to action is "Request a Demo"
