          - $ref: '#/components/schemas/OutputParams'
        pagination:
          description: Pagination metadata
          allOf:
          - $ref: '#/components/schemas/Pagination'
        data:
          description: List of events
          allOf:
          - $ref: '#/components/schemas/Event'
      type: object
    Summary:
      properties:
        title:
          type: string
          description: Title for the summary text (if applicable)
        summary:
          type: array
          description: Summary text
          items:
            type: string
        model:
          type: string
          description: Source of the summary
        type:
          type: string
