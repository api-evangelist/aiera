openapi: 3.2.0
info:
  title: Aiera Events v2 API
  version: '1.0'
  description: 'Operations tagged Events v2 across 3 of this provider''s published API definitions: aiera-rest-api-openapi.json, aiera-tonal-sentiments-openapi.yaml, aiera-unified-openapi.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://rest-api.aiera.com/api
- url: https://premium.aiera.com/api
tags:
- name: Events (v2)
  description: Event data and transcripts
paths:
  /events-v2/:
    get:
      tags:
      - Events (v2)
      summary: Find Events
      description: 'Retrieve events by ticker, date range, and other filtering criteria.


        **Notes:**

        - There is a response cap of 1000 events at a time, broken into 10 pages, with 100 results on each page.

        - `modified_since` can be used to synchronize with an external system.

        - All dates (`event_date`, `created`, `modified`) are in Eastern Time (America/New_York timezone) and formatted in ISO 8601.

        - Only **one** of the equity identifiers (`bloomberg_ticker`, `isin`, `ric`, `permid`, or `ticker`) should be used per request. Using multiple equity identifier query parameters will end up resolving only one of them.

        - Setting the `simplified` flag to true will significantly speed up query performance, but also nullify enriched fields like transcription details, connection information, and linguistics data.'
      operationId: get_get_events
      security:
      - apiKeyHeader: []
      parameters:
      - name: start_date
        in: query
        description: Start date (default 2 weeks ago)
        schema:
          type: string
          format: date-time
      - name: end_date
        in: query
        description: End date (default 2 weeks from now)
        schema:
          type: string
          format: date-time
      - name: event_type
        in: query
        description: Event types to include
        schema:
          type: array
          items:
            type: string
            enum:
            - earnings
            - presentation
            - shareholder_meeting
            - investor_meeting
            - special_situation
            - earnings_release
      - name: event_tag
        in: query
        description: Filter by event tags, comma-separated
        schema:
          type: array
          items:
            type: string
      - name: modified_since
        in: query
        description: Return events modified after this date (ISO format)
        schema:
          type: string
          format: date-time
      - name: fiscal_year
        in: query
        description: Filter by fiscal year
        schema:
          type: integer
      - name: fiscal_quarter
        in: query
        description: Filter by fiscal quarter (1-4)
        schema:
          type: integer
      - name: equity_id
        in: query
        description: Filter by equity ID
        schema:
          type: integer
      - name: company_id
        in: query
        description: Filter by company ID
        schema:
          type: string
      - name: bloomberg_ticker
        in: query
        description: Filter to one or more Bloomberg tickers, comma-separated (e.g. AAPL:US)
        schema:
          type: string
      - name: isin
        in: query
        description: Filter to one or more ISINs, comma-separated
        schema:
          type: string
      - name: permid
        in: query
        description: Filter to one or more PermIDs, comma-separated
        schema:
          type: string
      - name: ric
        in: query
        description: Filter to one or more RICs, comma-separated
        schema:
          type: string
      - name: ticker
        in: query
        description: Filter to one or more ticker symbols, comma-separated
        schema:
          type: string
      - name: sector_id
        in: query
        description: Filter to a specific GICS sector ID
        schema:
          type: integer
      - name: subsector_id
        in: query
        description: Filter to a specific GICS sub-sector ID
        schema:
          type: integer
      - name: event_ids
        in: query
        description: Filter to one or more event IDs, comma-separated
        schema:
          type: array
          items:
            type: string
      - name: expected_language
        in: query
        description: Filter to a specific expected language code
        schema:
          type: string
      - name: with_transcripts
        in: query
        description: Whether to include only events with transcripts
        schema:
          type: boolean
      - name: with_pricing
        in: query
        description: Whether to include only events with pricing data
        schema:
          type: boolean
      - name: simplified
        in: query
        description: Whether to simplify the payload response and avoid data enrichment
        schema:
          type: boolean
      - name: linguistics
        in: query
        description: Whether to include linguistics data (topics, sentiment, summaries)
        schema:
          type: boolean
      - name: pricing
        in: query
        description: Whether to include price reaction information
        schema:
          type: boolean
      - name: transcripts
        in: query
        description: Whether to include transcript data
        schema:
          type: boolean
      - name: word_offsets
        in: query
        description: Whether to include word timing offsets
        schema:
          type: boolean
      - name: page
        in: query
        description: Page number
        schema:
          type: integer
          default: 1
      - name: page_size
        in: query
        description: Results per page
        schema:
          type: integer
          default: 100
          minimum: 10
          maximum: 100
      - name: sort_key
        in: query
        description: Sort key for results
        schema:
          type: string
          enum:
          - event_id_asc
          - event_id_desc
          - event_date_asc
          - event_date_desc
      - name: live_only
        in: query
        description: Only return currently-live events
        schema:
          type: boolean
      - name: improved_only
        in: query
        description: Whether or not to only return the post-realtime improved transcripts
        schema:
          type: boolean
      - name: include_deleted
        in: query
        description: Whether to include deleted events
        schema:
          type: boolean
      - name: include_everything
        in: query
        description: Whether or not to include any transcripts, regardless of offset
        schema:
          type: boolean
      - name: include_connection_detail
        in: query
        description: Whether to include connection detail
        schema:
          type: boolean
      - name: include_hierarchy
        in: query
        description: Whether to include event hierarchy detail
        schema:
          type: boolean
      - name: include_estimated_docs
        in: query
        description: Whether to include model-estimated press/slides URLs
        schema:
          type: boolean
      - name: include_tags
        in: query
        description: Whether to include event tags
        schema:
          type: boolean
      - name: include_company_metadata
        in: query
        description: Whether to include the associated company's metadata (e.g. names, urls)
        schema:
          type: boolean
      - name: include_people_data
        in: query
        description: Whether or not to include people information for equity/event
        schema:
          type: boolean
      - name: exclude_duplicates
        in: query
        description: Whether to exclude any duplicated events
        schema:
          type: boolean
      - name: company_rollup
        in: query
        description: Whether to roll up matches to the corresponding company entity
        schema:
          type: boolean
      - name: event_category
        in: query
        description: Filter by event category
        schema:
          type: string
          enum:
          - expert_insights
          - thirdbridge
      - name: primary_only
        in: query
        description: Only return events on primary equities
        schema:
          type: boolean
      - name: X-Fields
        in: header
        description: An optional fields mask
        schema:
          type: string
          format: mask
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Events'
        '400':
          description: Bad request
    servers:
    - url: https://rest-api.aiera.com/api
