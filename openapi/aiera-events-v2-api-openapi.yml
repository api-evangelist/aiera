  /events-v2/tonal/export/csv:
    get:
      security:
      - ApiKeyAuth: []
      operationId: getTonalSentiments``
      description: Export tonal sentiment to csv. .
      summary: Retrieves a csv file of a tonal sentiment
      parameters:
      - name: bloomberg_ticker
        in: query
        required: false
        schema:
          type: string
        description: Filter events to 1+ bloomberg tickers always including country codes with colon (comma-separated).
      responses:
        '200':
          description: Successfully uploaded the csv file.
          content:
            application/csv:
              schema:
                type: string
                format: binary
          headers:
            content-disposition:
              schema:
                type: string
                description: Used only with `application/pdf` responses
                example: attachment; filename="name.pdf"
            content-encoding:
              schema:
                type: string
                description: Encoding of the file.
      tags:
      - Events (v2)
    servers:
    - url: https://premium.aiera.com/api
  /events-v2/person/{person_id}:
    get:
      operationId: getPerson
      description: Retrieves a person using a person id.
      summary: Retrieves a single person
      parameters:
      - name: person_id
        in: path
        required: true
        schema:
          type: integer
        description: person id to get the speaker details
      responses:
        '200':
          description: Successfully retrieved the person details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person_2'
        '404':
          description: Person not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Events (v2)
      security:
      - ApiKeyAuth: []
    servers:
    - url: https://premium.aiera.com/api
components:
  schemas:
    Grouping:
