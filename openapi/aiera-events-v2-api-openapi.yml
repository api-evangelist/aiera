  /events-v2/{event_id}/transcript:
    get:
      tags:
      - Events (v2)
      summary: Get Transcripts
      description: 'Returns the available transcripts for an event.


        **Notes:**

        - The `modified_since` parameter enables continuous fetching of newer transcripts during live events.'
      operationId: get_get_event_transcripts
      security:
      - apiKeyHeader: []
      parameters:
      - name: event_id
        in: path
        required: true
        description: The event id for which to fetch the transcripts
        schema:
          type: string
      - name: modified_since
        in: query
        description: Returns transcripts modified since this date
        schema:
          type: string
          format: date-time
      - name: linguistics
        in: query
        description: Whether to include linguistics metadata in the response
        schema:
          type: boolean
      - name: pricing
        in: query
        description: Whether to include price reaction information
        schema:
          type: boolean
      - name: live_only
        in: query
        description: Only return live transcript items
        schema:
          type: boolean
      - name: improved_only
        in: query
        description: Whether or not to only return the post-realtime improved transcripts
        schema:
          type: boolean
      - name: include_deleted
        in: query
        description: Whether or not to include deleted transcripts
        schema:
          type: boolean
      - name: include_everything
        in: query
        description: Whether or not to include any transcripts, regardless of offset
        schema:
          type: boolean
      - name: include_tags
        in: query
        description: Whether or not to include transcript tagging (presentation, Q&A, etc)
        schema:
          type: boolean
      - name: word_offsets
        in: query
        description: Whether to include word-by-word durations and offsets
        schema:
          type: boolean
      - name: X-Fields
        in: header
        description: An optional fields mask
        schema:
          type: string
          format: mask
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transcript'
        '404':
          description: Event not found
    servers:
    - url: https://rest-api.aiera.com/api
