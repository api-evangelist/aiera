aid: aiera
name: Aiera
description: >-
  Aiera is a New York-based financial research technology company that provides real-time and historical
  intelligence on public-company events. Its platform covers earnings calls, investor days, conferences and
  shareholder meetings with live AI transcription plus human-edited transcripts, and layers on AI-generated
  summaries, topic and tonal-sentiment analysis, SEC filings, company-published documents, broker research,
  expert-insight content (including Third Bridge) and financial news. Aiera exposes that corpus to buy-side and
  sell-side institutions through an entitlement-aware REST API, a hosted remote MCP server for LLM and agentic
  workflows, embeddable web components (AieraChat, Aieracast, EventList), and an open-source Python MCP package.
image: https://aiera.com/wp-content/uploads/2025/09/aiera-default-feature.jpg
url: https://raw.githubusercontent.com/api-evangelist/aiera/refs/heads/main/apis.yml
x-type: company
x-source: harvest:secondary-market
specificationVersion: '0.20'
created: '2026-09-14'
modified: '2026-09-14'
tags:
- Financial Research
- Earnings Calls
- Transcripts
- SEC Filings
- Market Data
- Financial Data
- Broker Research
- Expert Networks
- Speech-to-Text
- Financial-Services
- MCP
- agent-native
tags_raw:
