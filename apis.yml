apis:
- name: Aiera REST API
  description: >-
    Entitlement-aware REST API over Aiera's financial research corpus — corporate events and transcripts,
    calendars and estimated events, equities and sectors, companies and people, SEC filings, company-published
    documents, broker research, Third Bridge expert-access content, Transcrippets and chat sessions. Authenticated
    with an issued API key passed in the X-API-Key header (an api_key query parameter is also accepted).
  humanURL: https://rest.aiera.com/
  baseURL: https://premium.aiera.com/api
