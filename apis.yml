- name: Aiera MCP Server
  description: >-
    Aiera's hosted remote Model Context Protocol server, exposing the financial research corpus to LLMs and
    agentic workflows as roughly three dozen specialized tools across equities and financials, indexes and
    watchlists, events and transcripts, SEC filings, company documents, Third Bridge expert insights, broker
    research and trusted web search. Reachable over HTTP at https://mcp-pub.aiera.com/ with an API key, or via
    OAuth 2.1 (Amazon Cognito issuer, PKCE, dynamic client registration) as used by the Claude and ChatGPT
    connector directories. An open-source Python package runs the same tool surface over stdio.
  humanURL: https://rest.aiera.com/docs/mcp
  baseURL: https://mcp-pub.aiera.com
