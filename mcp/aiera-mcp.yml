method: probed
source: https://rest.aiera.com/docs/mcp (and /docs/mcp-tools, /docs/mcp-platforms, /docs/mcp-sdks); live POST tools/list against https://mcp-pub.aiera.com/; https://github.com/aiera-inc/aiera-mcp
name: Aiera MCP Server
description: >-
  Aiera ships a hosted remote MCP server exposing its financial research corpus — earnings calls and
  transcripts, calendars, equities and financials, SEC filings, company-published documents, Third Bridge
  expert insights, broker research and trusted web search — as specialized tools for LLM and agentic
  workflows. It also publishes an open-source Python package (aiera-mcp-tools) that runs the same tool
  surface locally over stdio, so both delivery modes are real.
deployment:
  mode: both
  endpoint: https://mcp-pub.aiera.com/
  install: pip install git+https://github.com/aiera-inc/aiera-mcp.git
  package: https://github.com/aiera-inc/aiera-mcp
  auth: oauth
  verified: probed
  note: >-
    The remote endpoint accepts an API key as a query parameter (https://mcp-pub.aiera.com/?api_key=...)
    per the provider's own OpenAI and Anthropic SDK examples, and OAuth 2.1 for the Claude and ChatGPT
    connector directories. An anonymous POST of tools/list returned HTTP 401
    {"error":"authentication_required", ..., "oauth_discovery_url":"https://mcp-pub.aiera.com/.well-known/oauth-protected-resource"},
    which is what establishes the endpoint as a live, OAuth-gated MCP server.
transport:
  protocol: http
  endpoint: https://mcp-pub.aiera.com/
  local_command: uv run entrypoint.py
authentication:
  remote:
    primary: oauth2
    authorization_server: https://mcp-pub.aiera.com (issuer https://cognito-idp.us-east-1.amazonaws.com/us-east-1_vFMHse86f)
    metadata:
    - well-known/aiera-mcp-pub-oauth-authorization-server.json
    - well-known/aiera-mcp-pub-oauth-protected-resource.json
    scopes:
    - openid
    - profile
    - email
    pkce: S256
    dynamic_client_registration: true
    alternate: api_key query parameter (api_key=)
  local:
    method: api_key
    env: AIERA_API_KEY
    base_url_env: AIERA_BASE_URL
    base_url_default: https://graphql.aiera.com/api
x-evidence:
  fetched: '2026-09-14'
  probes:
  - url: https://mcp-pub.aiera.com/
    method: 'POST {"jsonrpc":"2.0","id":1,"method":"tools/list"}'
