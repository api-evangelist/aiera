  - url: https://mcp-pub.aiera.com/.well-known/oauth-protected-resource
    http_status: 200
  - url: https://mcp-pub.aiera.com/.well-known/oauth-authorization-server
    http_status: 200
schema_note: >-
  Live tools/list introspection is OAuth-gated, so per-tool inputSchema could not be captured
  anonymously. The tool inventory below is transcribed from Aiera's own published tool reference at
  https://rest.aiera.com/docs/mcp-tools, which names each tool and its parameters. Parameter names are
  the provider's; full JSON Schema types require an authenticated tools/list call.
clients:
  directories:
  - name: Claude connector directory
    note: Search "Aiera" in the Claude Settings > Connectors store; authenticates with Aiera dashboard credentials.
    source: https://rest.aiera.com/docs/mcp-platforms
  - name: ChatGPT connector marketplace
    note: Search "Aiera" in the ChatGPT Connectors admin page; authenticates with Aiera dashboard credentials.
    source: https://rest.aiera.com/docs/mcp-platforms
  sdk_examples:
  - vendor: OpenAI
    shape: 'tools[{type: mcp, server_label: Aiera, server_url: https://mcp-pub.aiera.com/?api_key=...}]'
  - vendor: Anthropic
    shape: 'mcp_servers[{type: url, name: Aiera, url: https://mcp-pub.aiera.com/?api_key=...}]'
