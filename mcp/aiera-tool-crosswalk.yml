method: derived
source: mcp/aiera-mcp.yml (tool inventory from https://rest.aiera.com/docs/mcp-tools) bound against openapi/aiera-rest-api-openapi.json and openapi/aiera-unified-openapi.yaml
note: >-
  Live MCP tools/list is OAuth-gated (HTTP 401 anonymously), so bindings are made by name and documented
  semantics rather than by comparing live inputSchema to OpenAPI parameters. Confidence is set accordingly.
  A striking finding: Aiera's MCP surface and its published OpenAPI surface are only partly overlapping
  projections of the same corpus. Financials, ratios, KPIs and segments, indexes, watchlists, conferences
  and all four embedding-based semantic search tools have NO operation in either published spec, while
  chat sessions, Transcrippets, people, user admin and entitlements have no MCP tool.
