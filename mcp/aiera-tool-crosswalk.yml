    gated: false
  - file: openapi/aiera-unified-openapi.yaml
    served_at: https://github.com/aiera-inc/aiera-rest-openapi/blob/main/specs/unified.yaml
    servers: https://premium.aiera.com/api
    operations: 26
    gated: false
  mcp:
    url: https://mcp-pub.aiera.com/
    tool_count: 39
    gated: true
    gate: OAuth 2.1 (Cognito) or api_key query parameter
  graphql:
    endpoint: https://graphql.aiera.com/api
    gated: true
    note: >-
      Named as the default AIERA_BASE_URL in the aiera-mcp package README. POST introspection returns
      HTTP 405 Method Not Allowed, and Aiera publishes no GraphQL schema or GraphQL documentation; the
      host appears to front the REST surface. Recorded as unverified, not as a GraphQL contract.
