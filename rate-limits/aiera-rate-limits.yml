note: >-
  Aiera documents no rate limits. A search of the served OpenAPI found zero occurrences of 429,
  "rate limit", "ratelimit", "throttle" or "Retry-After", and no operation declares a 429 response. The
  same search across Aiera's REST documentation pages found no limits page and no limit statements. The
  only quantitative ceiling Aiera publishes anywhere is a pagination bound, which is not a rate limit —
  and the two surfaces state it differently.
